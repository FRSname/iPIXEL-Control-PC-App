; PlatformIO project for iPixel-IG-Counter
; Target: ESP32-WROOM-32U (external antenna). Board id `esp32dev` covers all
; ESP32-WROOM-32x variants — antenna choice is hardware, not firmware.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; LittleFS hosts the web UI files in data/ — `pio run -t uploadfs` flashes them.
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    esphome/ESPAsyncWebServer-esphome@^3.2.2
    esphome/AsyncTCP-esphome@^2.1.4
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17
